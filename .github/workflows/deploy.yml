name: CI/CD Pipeline - tnbSwitch Backend

# PRÉREQUIS (une seule fois, à la main, avant le premier run de cette pipeline) :
#   scp docker-compose.yml <vps>:/home/ubuntu/tnb-switch/infra/
#   cd /home/ubuntu/tnb-switch/infra && docker compose --profile infra up -d
# -> démarre zookeeper/kafka/kafka-ui une fois pour toutes, partagés
#    entre dev/preprod/prod. Cette pipeline ne les touche JAMAIS :
#    `docker compose up -d` (sans --profile) ignore par défaut tout
#    service portant `profiles: ["infra"]`.
#
# Déclenchement : chaque branche pousse sur un environnement dédié.
# develop -> dev | preprod -> preprod | main -> prod
on:
  push:
    branches:
      - develop
      - preprod
      - main

jobs:

  # ============================================================
  # JOB 1 — Mappe la branche poussée vers l'environnement GitHub
  # (dev/preprod/prod) et vers le nom de dossier sur le serveur
  # ============================================================
  set-env:
    runs-on: ubuntu-latest
    outputs:
      gh_environment: ${{ steps.map.outputs.gh_environment }}
    steps:
      - id: map
        run: |
          case "${{ github.ref_name }}" in
            develop) echo "gh_environment=dev" >> "$GITHUB_OUTPUT" ;;
            preprod) echo "gh_environment=preprod" >> "$GITHUB_OUTPUT" ;;
            main)    echo "gh_environment=prod" >> "$GITHUB_OUTPUT" ;;
          esac

  # ============================================================
  # JOB 2 — Build l'image Docker et la pousse sur Docker Hub
  # ============================================================
  build-and-push:
    needs: set-env
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.gh_environment }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}

  # ============================================================
  # JOB 3 — Déploie le backend sur le serveur via SSH, dans un
  # dossier dédié à l'environnement. `docker compose up -d` (sans
  # --profile) n'inclut que tnbswitch-backend — kafka/zookeeper/
  # kafka-ui (profil "infra") restent hors de portée, quel que
  # soit le nombre de fois où cette pipeline tourne.
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [set-env, build-and-push]
    environment: ${{ needs.set-env.outputs.gh_environment }}
    concurrency:
      group: deploy-${{ needs.set-env.outputs.gh_environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Copie du docker-compose.yml sur le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/tnb-switch/${{ needs.set-env.outputs.gh_environment }}/"

      - name: Déploiement automatique sur le serveur via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/tnb-switch/${{ needs.set-env.outputs.gh_environment }}/logs
            cd /home/ubuntu/tnb-switch/${{ needs.set-env.outputs.gh_environment }}

            cat > .env <<EOF
            IMAGE_NAME=${{ vars.IMAGE_NAME }}
            IMAGE_TAG=${{ vars.IMAGE_TAG }}
            CONTAINER_NAME=${{ vars.CONTAINER_NAME }}
            SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE }}
            SERVER_PORT=${{ vars.SERVER_PORT }}
            MANAGEMENT_SERVER_PORT=${{ vars.MANAGEMENT_SERVER_PORT }}
            DB_HOST=${{ vars.DB_HOST }}
            DB_PORT=${{ vars.DB_PORT }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            KAFKA_BROKERS=${{ vars.KAFKA_BROKERS }}
            KAFKA_TOPIC_PREFIX=${{ vars.KAFKA_TOPIC_PREFIX }}
            KAFKA_CONSUMER_GROUP_ID=${{ vars.KAFKA_CONSUMER_GROUP_ID }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DEVICE_JWT_SECRET=${{ secrets.DEVICE_JWT_SECRET }}
            SMS_PROVIDER=${{ vars.SMS_PROVIDER }}
            SEED_ADMIN_ENABLED=${{ vars.SEED_ADMIN_ENABLED }}
            SEED_ADMIN_PHONE_NUMBER=${{ vars.SEED_ADMIN_PHONE_NUMBER }}
            IA_RECONCILIATION_URL=${{ vars.IA_RECONCILIATION_URL }}
            EOF
            chmod 600 .env

            docker pull ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f

      - name: Vérification du déploiement (healthcheck sur le port management)
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://${{ secrets.VPS_SSH_HOST }}:${{ vars.MANAGEMENT_SERVER_PORT }}/actuator/health; then
              echo "✅ Application prête"
              exit 0
            fi
            echo "Tentative $i/20 — application pas encore prête, nouvel essai dans 10s..."
            sleep 10
          done
          echo "❌ L'application n'a jamais répondu après 200s"
          exit 1