# ============================================================
#  APPLICATION
# ============================================================
spring.application.name=tnbswitch-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ============================================================
#  DATASOURCE  PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tnb-switch-dev}
spring.datasource.username=${DB_USER:brice}
spring.datasource.password=${DB_PASSWORD:Brice1954}
spring.datasource.driver-class-name=org.postgresql.Driver#
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000


# ============================================================
#  JPA / HIBERNATE  (ddl-auto=update pour auto-migration)
# ============================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false

# Dans application.properties
logging.level.org.springframework.kafka=ERROR
logging.level.org.apache.kafka=ERROR
# ============================================================
#  KAFKA
# ============================================================

spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:tnbswitch-backend}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3
spring.kafka.listener.missing-topics-fatal=false

# ============================================================
#  SERVER
# ============================================================
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/api/v1
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain

# ============================================================
#  MANAGEMENT / ACTUATOR / PROMETHEUS
# ============================================================
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.tnb.transaction.duration=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s,5s
management.metrics.distribution.slo.tnb.transaction.duration=100ms,500ms,1s,2s,5s,10s,30s

# ============================================================
#  TNB SWITCH  CUSTOM PROPERTIES
# ============================================================
# ----- SECURITE / JWT -----
tnb.security.jwt.secret=${JWT_SECRET:8d3a7f2e9c1b4a5d6e7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8}
tnb.security.jwt.access-token-expiration=86400000
tnb.security.jwt.refresh-token-expiration=604800000
tnb.security.jwt.issuer=tnbswitch-backend

tnb.security.device-jwt.secret=${DEVICE_JWT_SECRET:8d3a7f2e9c1b4a5d6e7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8}
tnb.security.device-jwt.expiration=604800000

# ----- OTP -----
tnb.otp.length=6
tnb.otp.ttl-seconds=300
tnb.otp.max-attempts=3
tnb.otp.throttle-seconds=300
tnb.otp.sms-provider=${SMS_PROVIDER:mock}

# ----- ROUTAGE (topics préfixés par environnement, ex: tnb.dev / tnb.preprod / tnb.prod) -----
tnb.kafka.topic-prefix=${KAFKA_TOPIC_PREFIX:tnb.dev}

tnb.routing.withdrawal-topic=${tnb.kafka.topic-prefix}.withdrawal.commands
tnb.routing.execution-topic=${tnb.kafka.topic-prefix}.execution.commands
tnb.routing.compensation-topic=${tnb.kafka.topic-prefix}.compensation.commands
tnb.routing.dlq-topic=${tnb.kafka.topic-prefix}.dead.letter.queue
tnb.reconciliation.topic=${tnb.kafka.topic-prefix}.reconciliation.commands

tnb.routing.max-retries=3
tnb.routing.retry-delay-seconds=30
tnb.routing.device-timeout-seconds=60
tnb.routing.sms-reconciliation-timeout-seconds=300
tnb.routing.sms-reconciliation-extended-seconds=900
tnb.routing.sms-reconciliation-audit-threshold-seconds=600
tnb.routing.fifo-strict=true
tnb.routing.device-lock-wait-seconds=5
tnb.routing.device-lock-lease-seconds=30

# ----- FLOTTE -----
tnb.fleet.low-balance-threshold=5000
tnb.fleet.critical-balance-threshold=1000
tnb.fleet.heartbeat-interval-seconds=30
tnb.fleet.heartbeat-timeout-seconds=90

# ----- PARSING SMS -----
tnb.reconciliation.enabled=true
tnb.reconciliation.fallback-to-manual=true
tnb.reconciliation.max-pending-per-device=2

# ----- WEBSOCKET STOMP -----
tnb.websocket.endpoint=/ws
tnb.websocket.heartbeat-inbound=10000
tnb.websocket.heartbeat-outbound=10000
tnb.websocket.device-topic-prefix=/topic/device
tnb.websocket.client-topic-prefix=/topic/client
tnb.websocket.admin-topic-prefix=/topic/admin
tnb.websocket.allowed-origins=*

# ----- SERVICE IA -----
tnb.ia.reconciliation.base-url=${IA_RECONCILIATION_URL:http://ia-service:8081/api}
tnb.ia.reconciliation.timeout-ms=3000
tnb.ia.reconciliation.confidence-threshold=0.85
tnb.ia.reconciliation.max-retries=2

# ----- RESILIENCE4J (Circuit Breaker IA) -----
resilience4j.circuitbreaker.instances.iaReconciliation.sliding-window-size=20
resilience4j.circuitbreaker.instances.iaReconciliation.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.iaReconciliation.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.iaReconciliation.permitted-number-of-calls-in-half-open-state=5
resilience4j.timelimiter.instances.iaReconciliation.timeout-duration=3s

# ----- SEED ADMIN -----
tnb.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
tnb.seed.admin.phone-number=${SEED_ADMIN_PHONE_NUMBER:+237658734332}